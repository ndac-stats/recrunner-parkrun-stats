# This workflow will install Python dependencies and update athlete results
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Update athlete results

on:
  workflow_dispatch: 
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .
    - name: Update results
      run: python src/ndac_parkrun_results/update_results.py
    - name: Commit updated results
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add data/results.json
        if ! git diff --cached --quiet; then
          git commit -m "chore: update results.json"
          git push
        else
          echo "No changes to results.json"
        fi
